name: Sync GitHub data

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours — matches deploy.yml cadence
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-github-data]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-github-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec tsx scripts/sync-github-data.ts

      - name: Run roadmap sync (all projects)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec tsx scripts/sync-roadmaps.ts

      - name: Propose checked snapshot refresh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain public/github-data)" ]]; then
            pending="$(gh pr list --state open --base main --limit 100 \
              --json number,headRefName,headRefOid,author,isCrossRepository,mergeStateStatus \
              --jq '[.[] | select(.author.login == "github-actions[bot]" and .isCrossRepository == false and (.headRefName | startswith("automation/github-data-")))]')"
            pending_count="$(jq 'length' <<< "$pending")"
            if (( pending_count > 1 )); then
              echo 'Multiple generated snapshot pull requests need reconciliation.' >&2
              exit 1
            fi
            if (( pending_count == 1 )); then
              IFS=$'\t' read -r pending_number pending_branch pending_sha merge_state < <(
                jq -r '.[0] | [.number, .headRefName, .headRefOid, .mergeStateStatus] | @tsv' <<< "$pending"
              )
              [[ "$pending_number" =~ ^[0-9]+$ && "$pending_branch" =~ ^automation/github-data-[0-9]+-[0-9]+$ && "$pending_sha" =~ ^[0-9a-f]{40}$ ]]
              if [[ "$merge_state" == BEHIND ]]; then
                gh api --method PUT "repos/$GH_REPO/pulls/$pending_number/update-branch" \
                  -f "expected_head_sha=$pending_sha"
                for attempt in {1..12}; do
                  updated_sha="$(gh pr view "$pending_number" --json headRefOid --jq .headRefOid)"
                  if [[ "$updated_sha" =~ ^[0-9a-f]{40}$ && "$updated_sha" != "$pending_sha" ]]; then
                    gh workflow run ci.yml --ref "$pending_branch"
                    exit 0
                  fi
                  printf 'Waiting for the generated branch update (%s/12).\n' "$attempt"
                  sleep 5
                done
                echo 'The generated branch update did not complete within the observation window.' >&2
                exit 1
              fi
              echo 'A generated snapshot pull request is already pending.'
              exit 0
            fi
            branch="automation/github-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git switch -c "$branch"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/github-data
            git commit -m "chore(github-data): refresh release snapshot"
            git push origin "HEAD:refs/heads/$branch"
            head_sha="$(git rev-parse HEAD)"
            pr_url="$(gh pr create --base main --head "$branch" \
              --title 'chore(github-data): refresh release snapshot' \
              --body 'Refresh the committed GitHub snapshots with the existing generators. The complete profile CI must pass before this pull request can merge.')"
            # A pull request created by GITHUB_TOKEN does not start PR workflows.
            # Dispatch the real workflow on the exact new branch instead.
            gh workflow run ci.yml --ref "$branch"
            gh pr merge "$pr_url" --auto --squash --match-head-commit "$head_sha"
          else
            echo "No changes — skipping commit."
          fi
