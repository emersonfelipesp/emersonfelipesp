---
name: dependency-security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    name: Dependency security and application gates
    runs-on: ci-untrusted-python312
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./dev.db
      HOME: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: https://git.nmulti.cloud/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the package manager
        run: test "$(pnpm --version)" = "10.33.2"

      - name: Install the reviewed graph
        run: pnpm install --frozen-lockfile

      - name: Verify dependency security invariants
        run: pnpm test:dependency-security

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Generate the Prisma client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
